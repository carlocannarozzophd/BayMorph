# Minimal configuration for the simulated-galaxy notebook.
# Omitted options are filled from BayMorph defaults.

object:
  name: simulated_galaxy

data:
  image_path: runs/simulated_galaxy/input/simulated_galaxy.fits
  target_position:
    x: 500
    y: 500
  cutout:
    mode: fixed
    size: 200

outputs:
  root: runs
  overwrite: true

simulation:
  shape: [1000, 1000]
  seed: 42

  truth:
    flux: 100000.0
    re: 30.0
    n: 4.0
    q: 0.5
    theta_deg: 45.0
    x0: 500.0
    y0: 500.0

  psf:
    type: gaussian
    fwhm: 3.0
    size: 25

  noise:
    sky: 50.0
    poisson_noise: true
    read_noise: 5.0

# BayMorph automatically determines the target geometry, radial-profile
# plateau, sky region, background, and robust noise estimate during image
# preparation. The mesh settings support the preliminary detection pass.
preparation:
  background:
    method: empirical
    box_size: 30
    filter_size: 3
  noise:
    method: empirical
  detection:
    n_sigma: 3.0
    n_pixels: 20
    n_levels: 32

psf:
  type: gaussian
  gaussian:
    fwhm: 3.0

fit:
  models:
    - single_sersic

  sampler:
    nlive: 500
    sample: rslice
    dlogz: 0.01
    seed: 42
    n_processes: 10
    queue_size: 10

  priors:
    single_sersic:
      x0:
        offset: 10.0
      y0:
        offset: 10.0

diagnostics:
  radial_profile:
    binning: fixed
    dr: 1.0
  titles:
    single_sersic: "Single Sérsic"
