# Validation configuration: near-noiseless single-Sérsic recovery.

object:
  name: simulated_galaxy_noiseless

data:
  image_path: runs/simulated_galaxy_noiseless/input/simulated_galaxy_noiseless.fits
  mask_path: null
  noise_map_path: null
  pixel_scale: null
  target_position:
    x: 500
    y: 500
  cutout:
    mode: auto
    initial_factor: 4.0
    sky_margin: 20.0
    min_size: 100
    max_size: null

outputs:
  root: runs
  overwrite: true

simulation:
  shape: [1000, 1000]
  seed: 42
  truth:
    flux: 100000.0
    re: 10.0
    n: 4.0
    q: 0.5
    theta_deg: 45.0
    x0: 500.0
    y0: 500.0
  psf:
    type: gaussian
    fwhm: 3.0
    size: 25
  noise:
    sky: 0.0
    poisson_noise: false
    read_noise: 0.1

preparation:
  background:
    method: empirical
    box_size: 30
    filter_size: 3
  noise:
    method: empirical
  detection:
    n_sigma: 3.0
    n_pixels: 20
    n_levels: 32

masking:
  connected_source:
    enabled: true
  star_halo:
    enabled: true
  interactive_refinement:
    enabled: false

psf:
  type: gaussian
  gaussian:
    fwhm: 3.0

fit:
  models:
    - single_sersic

  sampler:
    name: dynesty
    nlive: 100
    sample: rslice
    dlogz: 0.1
    seed: 42
    n_processes: 1
    queue_size: null

  comparison:
    enabled: false
    metric: bayes_factor

  priors:
    single_sersic:
      x0:
        offset: 10.0
      y0:
        offset: 10.0

diagnostics:
  format: pdf
  corner: true
  residual: true
  posterior_profile_bands: true
  radial_profile:
    binning: fixed
    dr: 5.0
  titles:
    single_sersic: "Single Sérsic"
