object:
  name: simulated_galaxy

data:
  image_path: runs/simulated_galaxy/input/simulated_galaxy.fits
  target_position:
    x: 80
    y: 80
  cutout:
    mode: fixed
    size: 161

outputs:
  root: runs
  overwrite: true

simulation:
  shape: [161, 161]
  seed: 42

  truth:
    flux: 20000.0
    re: 8.0
    n: 2.5
    q: 0.72
    theta_deg: 30.0
    x0: 80.0
    y0: 80.0

  psf:
    type: gaussian
    fwhm: 2.5

  noise:
    sky: 25.0
    poisson_noise: false
    read_noise: 5.0

psf:
  type: gaussian
  gaussian:
    fwhm: 2.5

fit:
  models:
    - single_sersic

  sampler:
    name: pocomc

  priors:
    single_sersic:
      # Explicit, data-independent prior defined by the simulation design.
      flux:
        type: uniform
        lower: 1000.0
        upper: 100000.0
