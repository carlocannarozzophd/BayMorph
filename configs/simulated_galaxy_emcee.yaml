object:
  name: simulated_galaxy_emcee
data:
  image_path: runs/simulated_galaxy_emcee/input/simulated_galaxy_emcee.fits
  target_position:
    x: 60
    y: 60
  cutout:
    mode: fixed
    size: 121
outputs:
  root: runs
  overwrite: true
diagnostics:
  titles:
    single_sersic: "Simulated single-S\xE9rsic observation"
simulation:
  # The field must contain the sky plateau plus the preparation sky margin.
  shape:
  - 121
  - 121
  seed: 42
  truth:
    flux: 20000.0
    re: 6.0
    n: 2.0
    q: 0.75
    theta_deg: 25.0
    x0: 60.0
    y0: 60.0
  psf:
    type: gaussian
    fwhm: 2.0
  noise:
    sky: 20.0
    poisson_noise: false
    read_noise: 2.0
psf:
  type: gaussian
  gaussian:
    fwhm: 2.0
fit:
  models:
  - single_sersic
  likelihood:
    type: gaussian
    include_normalization: true
  sampler:
    name: emcee
    execution:
      processes: 2
      progress: true
    init:
      nwalkers: auto
      seed: 42
      checkpoint_path: auto
      checkpoint_mode: fresh
    run:
      burn_in: 300
      max_steps: 1000
      check_interval: 100
      min_autocorr_times: 50.0
      tau_tolerance: 0.05
  priors:
    single_sersic:
      flux:
        type: uniform
        lower: 5000.0
        upper: 50000.0
      re:
        type: uniform
        lower: 2.0
        upper: 12.0
      n:
        type: uniform
        lower: 0.8
        upper: 4.0
      q:
        type: uniform
        lower: 0.5
        upper: 1.0
      theta:
        type: uniform
        lower: -pi/2
        upper: pi/2
      x0:
        type: uniform
        lower: -3.0
        upper: 3.0
        relative_to: target_x
      y0:
        type: uniform
        lower: -3.0
        upper: 3.0
        relative_to: target_y

  background:
    model: constant
    priors:
      background_level:
        type: uniform
        lower: -10.0
        upper: 10.0
  comparison:
    enabled: false
    metric: bayes_factor
