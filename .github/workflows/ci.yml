name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: |
          ruff --version
          ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Build distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          rm -rf dist build baymorph.egg-info
          python -m build
          python -m twine check dist/*

      - name: Install built wheel into a clean environment
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          python -m venv /tmp/baymorph-wheel-env
          /tmp/baymorph-wheel-env/bin/python -m pip install --upgrade pip
          # pocoMC requires torch; install the CPU build first so pip does not
          # pull the multi-GB CUDA stack and exhaust the runner disk.
          /tmp/baymorph-wheel-env/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/baymorph-wheel-env/bin/python -m pip install dist/*.whl
          /tmp/baymorph-wheel-env/bin/python -c "import baymorph; print(baymorph.__version__)"
          /tmp/baymorph-wheel-env/bin/baymorph --version

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      - name: Build documentation
        run: python -m zensical build --strict
