site_name: BayMorph Scientific Documentation
site_description: >-
  Scientific documentation for BayMorph, an open-source Bayesian framework
  for astronomical morphology and multi-observation inference.
site_author: Carlo Cannarozzo
site_url: https://carlocannarozzophd.github.io/BayMorph/

repo_name: carlocannarozzophd/BayMorph
repo_url: https://github.com/carlocannarozzophd/BayMorph
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

exclude_docs: |
  /archive/

theme:
  name: material
  language: en

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  icon:
    repo: fontawesome/brands/github

nav:

- Home: index.md

- Getting Started:

  - Installation: guide/INSTALLATION.md
  - Quick Start: guide/QUICK_START.md
  - Command-Line Interface: guide/CLI.md
  - Configuration Reference: guide/CONFIGURATION.md
  - Preparation and Products: guide/PREPARATION_AND_PRODUCTS.md
  - Tutorials: guide/TUTORIALS.md

- Models:

  - models/index.md
  - Components: models/COMPONENTS.md
  - Single Sérsic: models/SINGLE_SERSIC.md
  - Double Sérsic: models/DOUBLE_SERSIC.md
  - Sérsic plus Point Source: models/SERSIC_POINT_SOURCE.md
  - Bulge and Disc: models/BULGE_DISK.md
  - Boxy or Discy Sérsic: models/BOXY_SERSIC.md
  - Core-Sérsic: models/CORE_SERSIC.md
  - Point-Spread Functions: models/PSF.md
  - Residual Background: models/BACKGROUND.md

- Public API: API.md

- Architecture:

  - Overview: architecture/ARCHITECTURE.md
  - Core Architecture: architecture/CORE_ARCHITECTURE.md
  - Core Contract: architecture/BAYMORPH_CORE_CONTRACT.md
  - Observation Model: architecture/OBSERVATION_MODEL.md
  - Morphological Components: architecture/MORPHOLOGICAL_COMPONENTS.md
  - Rendering: architecture/RENDERING.md
  - Inference: architecture/INFERENCE.md
  - Inference Geometry: architecture/INFERENCE_GEOMETRY.md
  - Pipeline: architecture/PIPELINE.md
  - Production Workflow: architecture/PRODUCTION_WORKFLOW.md
  - Multi-Observation Workflow: architecture/MULTI_OBSERVATION_PUBLIC_WORKFLOW.md
  - Validation Methodology: architecture/VALIDATION.md
  - Validation Code Boundary: architecture/VALIDATION_ARCHITECTURE.md
  - Architecture Decisions: architecture/decisions/README.md

- Research:

  - research/index.md
  - Formulation and Priors:
    - Multi-Observation Formulation: research/MULTI_OBSERVATION_FORMULATION.md
    - Prior and Configuration Contract: research/PRIOR_AND_CONFIGURATION_CONTRACT.md
    - Flux Prior Calibration: research/FLUX_PRIOR_CALIBRATION.md
  - Multi-Observation Inference:
    - Hierarchical Morphology Coupling: research/HIERARCHICAL_MORPHOLOGY_COUPLING.md
    - Wavelength Coupling Validation: research/WAVELENGTH_COUPLING_VALIDATION.md
    - Multi-Observation Simulation-Based Calibration: research/MULTI_OBSERVATION_SBC.md
    - Preparation-Free Multi-Observation Recovery: research/PREPARATION_FREE_MULTI_OBSERVATION_RECOVERY.md
  - Rendering and PSF:
    - Adaptive Rendering: research/ADAPTIVE_RENDERING.md
    - Sérsic Rendering Optimization: research/SERSIC_RENDERING_OPTIMIZATION.md
    - P0 Sérsic Rendering Benchmark: research/P0_SERSIC_RENDERING_BENCHMARK.md
    - PSF Characterization: research/PSF_CHARACTERIZATION.md
    - Empirical PSF Test Bench: research/PSF_TEST_BENCH_2026-09-30.md
    - Empirical PSF Builder Candidates: research/PSF_BUILDER_CANDIDATES_2026-09-30.md
    - Rendering Convention under an Empirical PSF: research/RENDERING_CONVENTION_2026-10-01.md
    - PSF and Rendering Errors in Fitted Sérsic Parameters: research/PSF_PARAMETER_SENSITIVITY_2026-10-01.md
    - Empirical PSF with Extended Wings: research/PSF_EXTENDED_WINGS_2026-10-01.md
    - AD-046 Proposal, Effective-PSF Rendering: research/PSF_RENDERING_PROPOSAL_2026-10-01.md
    - Cost of the Effective-PSF Rendering: research/EFFECTIVE_PSF_COST_2026-10-01.md
  - Noise and Background:
    - Noise and Background Chain: research/NOISE_BACKGROUND_AUDIT_2026-10-01.md
    - A Noise Model for Any Image: research/NOISE_MODEL_BENCH_2026-10-01.md
    - AD-047 Proposal, Noise Model: research/NOISE_MODEL_PROPOSAL_2026-10-02.md
  - Inference and Evidence:
    - pocoMC-Dynesty Initial Validation: research/pocomc_dynesty_initial_validation.md
    - Structure-Informed Evidence Estimation: research/STRUCTURE_INFORMED_EVIDENCE_2026-09-29.md
    - Structure-Informed Evidence for Other Likelihoods: research/STRUCTURE_INFORMED_EVIDENCE_LIKELIHOODS_2026-09-29.md
    - Adaptive Structure-Informed Evidence: research/STRUCTURE_INFORMED_EVIDENCE_ADAPTIVE_2026-09-30.md
  - Performance:
    - Performance Architecture P0: research/PERFORMANCE_ARCHITECTURE_P0.md
    - Likelihood Cost Decomposition: research/LIKELIHOOD_COST_DECOMPOSITION_2026-09-20.md
  - Production Target:
    - Cutout Footprint Selection: research/TARGET_CUTOUT_FOOTPRINT_SELECTION_2026-09-16.md
    - Empirical PSF Selection: research/TARGET_EMPIRICAL_PSF_SELECTION_2026-09-16.md
    - Residual Diagnostic: research/TARGET_R_RESIDUAL_DIAGNOSTIC_2026-09-20.md
  - Source Identification:
    - Computer-Vision Source Identification: research/CV_SOURCE_IDENTIFICATION_2026-10-01.md
  - Morphology Families:
    - Morphology Families Beyond the Sérsic Profile: research/MORPHOLOGY_FAMILIES_2026-10-02.md
    - Rendering of the Morphology Families: research/MORPHOLOGY_FAMILIES_RENDERING_2026-10-02.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables

  - toc:
      permalink: true

  - pymdownx.arithmatex:
      generic: true

  - pymdownx.details

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/carlocannarozzophd/BayMorph
      name: BayMorph on GitHub

copyright: >-
  Copyright &copy; Carlo Cannarozzo.
  BayMorph is distributed under the MIT License.

strict: true
