site_name: BayMorph
site_description: >-
  User documentation for BayMorph, an open-source Python package for the
  Bayesian inference of galaxy morphology from one or more images.
site_author: Carlo Cannarozzo
site_url: https://carlocannarozzophd.github.io/BayMorph/

repo_name: carlocannarozzophd/BayMorph
repo_url: https://github.com/carlocannarozzophd/BayMorph
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# The site is built by Zensical, which reads this MkDocs-format file.

theme:
  name: material
  variant: modern
  language: en
  logo: assets/logo/baymorph-tile.png
  favicon: assets/logo/favicon.png

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  icon:
    repo: fontawesome/brands/github

nav:

- Home: index.md

- Getting Started:

  - Installation: guide/INSTALLATION.md
  - Quick Start: guide/QUICK_START.md
  - Tutorials: guide/TUTORIALS.md

- User Guide:

  - guide/index.md
  - The Runner: guide/RUNNER.md
  - Writing a Configuration: guide/CONFIGURING.md
  - Image and Cutout: guide/IMAGE.md
  - Masks: guide/MASKS.md
  - Sky and Noise: guide/SKY_AND_NOISE.md
  - Point-Spread Function: guide/PSF.md
  - Fitting: guide/FITTING.md
  - Results: guide/RESULTS.md
  - Plotting: guide/PLOTTING.md
  - Several Observations: guide/MULTI_OBSERVATION.md
  - Simulated Images: guide/SIMULATIONS.md

- Models:

  - models/index.md
  - Galaxy Models:
    - Single Sérsic: models/SINGLE_SERSIC.md
    - Double Sérsic: models/DOUBLE_SERSIC.md
    - Sérsic plus Point Source: models/SERSIC_POINT_SOURCE.md
    - Bulge and Disc: models/BULGE_DISK.md
    - Boxy or Discy Sérsic: models/BOXY_SERSIC.md
    - Core-Sérsic: models/CORE_SERSIC.md
    - Bulge and Broken Disc: models/BULGE_BROKEN_DISK.md
    - Bulge, Disc and Bar: models/BULGE_DISK_BAR.md
    - Bulge, Disc and Ring: models/BULGE_DISK_RING.md
    - Bulge, Disc and Spiral Arms: models/BULGE_DISK_SPIRAL.md
  - Components: models/COMPONENTS.md
  - Point-Spread Functions: models/PSF.md
  - Noise Models: models/NOISE.md
  - Sky and Background: models/BACKGROUND.md

- Theory:

  - Bayesian Inference: theory/BAYESIAN_INFERENCE.md
  - Nested Sampling: theory/NESTED_SAMPLING.md
  - Hierarchical Models: theory/HIERARCHICAL_MODELS.md

- Reference:

  - Command Line: reference/CLI.md
  - Configuration: reference/CONFIGURATION.md
  - Output Files: reference/OUTPUT_FILES.md
  - Python API: reference/API.md


plugins:
  - search

  # The development documents are kept on the machines of the developers and
  # are not published: neither the repository nor the site holds them.
  # Zensical does not support exclude_docs and excludes them here, so that a
  # local copy never enters the site.
  - exclude:
      glob:
        - DEVELOPERS.md
        - archive/*
        - architecture/*
        - research/*

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables

  - toc:
      permalink: true

  - pymdownx.arithmatex:
      generic: true

  - pymdownx.details

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/brand.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/carlocannarozzophd/BayMorph
      name: BayMorph on GitHub

copyright: >-
  Copyright &copy; Carlo Cannarozzo.
  BayMorph is distributed under the MIT License.

strict: true
