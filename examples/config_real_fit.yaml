object:
  name: NGC1234

data:
  image_path: data/NGC1234/image.fits
  mask_path: null
  noise_map_path: null
  psf_path: null
  pixel_scale: null

  target_position:
    x: 730
    y: 720
  cutout_size: 600

outputs:
  root: outputs
  overwrite: false

preparation:
  background:
    method: empirical
  noise:
    method: empirical
  detection:
    n_sigma: 3.0
    n_levels: 32
    npixels: 20

  background:
    method: empirical
    box_size: 30
    filter_size: 3
    
masking:
  connected_source:
    enabled: true
  star_halo:
    enabled: true
  interactive_refinement:
    enabled: true

psf:
  type: empirical
  empirical:
    candidate_selection:
      auto: true
      target_n_candidates: 15
      min_area: 20
      max_area: 300
      min_peak: 50
      max_peak: 50000
      max_eccentricity: 0.50
      max_elongation: 1.50
      edge_margin: 80
      galaxy_exclusion_box: null
      sigma_factor: 4.0
      size_margin: 3
      min_half_size: 12
      max_half_size: 25
      isolation_margin: 5

fit:
  models:
    - single_sersic
    - double_sersic
  sampler:
    name: dynesty
    nlive: 500
  comparison:
    enabled: true
    metric: bayes_factor

diagnostics:
  corner: true
  residual: true
  radial_profile: true
  posterior_profile_bands: true