object:
  name: sim_single_sersic_no_noise
data:
  image_path: outputs/sim_single_sersic_no_noise/sim_single_sersic_no_noise.fits
  mask_path: null
  noise_map_path: outputs/sim_single_sersic_no_noise/sim_single_sersic_no_noise_noise.fits
  psf_path: null
  pixel_scale: 0.21
  target_position:
    x: 50.0
    y: 50.0
  cutout:
    mode: fixed
    size: 100
outputs:
  root: outputs
  overwrite: true
fit:
  models:
  - single_sersic
  #- double_sersic
  sampler:
    name: dynesty
    nlive: 100
    sample: rslice
    dlogz: 1.0
    seed: 42
    n_processes: 10
    queue_size: 10
  comparison:
    enabled: true
    metric: bayes_factor
  priors:
    single_sersic:
      flux:
        min_factor: 0.2
        max_factor: 2.0
      re:
        min: 5.0
        max: 20.0
      n:
        min: 0.1
        max: 8.0
      q:
        min: 0.1
        max: 1.0
      theta:
        min: -pi/2
        max: pi/2
      x0:
        offset: 5.0
      y0:
        offset: 5.0
      sky:
        min: -5.0
        max: 5.0
    double_sersic:
      flux_bulge:
        min_factor: 0.0
        max_factor: 1.5
      re_bulge:
        min: 1.0
        max: 40.0
      n_bulge:
        min: 0.5
        max: 8.0
      flux_disk:
        min_factor: 0.0
        max_factor: 2.0
      re_disk:
        min: 5.0
        max: 120.0
      n_disk:
        min: 0.5
        max: 6.0
      q:
        min: 0.3
        max: 1.0
      theta:
        min: -pi/2
        max: pi/2
      x0:
        offset: 5.0
      y0:
        offset: 5.0
      sky:
        min: -5.0
        max: 5.0
psf:
  type: gaussian
  gaussian:
    fwhm: 3.5
  empirical:
    candidate_selection:
      auto: true
      target_n_candidates: 30
    construction:
      auto_size: true
      normalize: true
masking:
  connected_source:
    enabled: false
  star_halo:
    enabled: false
  interactive_refinement:
    enabled: false
preparation:
  background:
    method: empirical
    box_size: 30
    filter_size: 3
  noise:
    method: external
  detection:
    n_sigma: 1.0
    n_levels: 32
    npixels: 5
diagnostics:
  corner: true
  residual: true
  radial_profile: true
  posterior_profiles: true
