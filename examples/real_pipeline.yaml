object:
  name: example_galaxy

data:
  image_path: data/example_galaxy.fits
  mask_path: null
  noise_map_path: null
  psf_path: null
  pixel_scale: null
  target_position: {x: 730, y: 720}
  cutout:
    mode: fixed
    size: 600

outputs:
  root: outputs
  overwrite: false

preparation:
  background:
    method: empirical
    box_size: 30
    filter_size: 3
  noise:
    method: empirical
  detection:
    n_sigma: 3.0
    n_levels: 32
    npixels: 20

masking:
  connected_source: {enabled: true}
  star_halo: {enabled: true}
  interactive_refinement: {enabled: true}

psf:
  type: empirical

fit:
  models: [single_sersic, double_sersic]
  sampler:
    name: dynesty
    nlive: 200
    sample: rslice
    dlogz: 0.1
  comparison:
    enabled: true
    metric: bayes_factor

diagnostics:
  format: pdf
  corner: true
  residual: true
  radial_profile: true
  posterior_profile_bands: true
