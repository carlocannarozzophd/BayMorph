# BayMorph mock single-Sérsic simulation example.
# This config drives both the mock creation step in the notebook and the
# standard BayMorph image-preparation + fitting pipeline.

object:
  name: mock_single_sersic_demo

data:
  image_path: notebooks/outputs/mock_single_sersic_demo/input/mock_single_sersic_demo.fits
  target_position:
    x: 50
    y: 50
  cutout:
    mode: fixed
    size: 101

outputs:
  root: notebooks/outputs
  overwrite: true

# Extra section used only by the notebook to create the controlled mock image.
# The BayMorph pipeline ignores this section.
simulation:
  shape: [101, 101]
  sky: 5.0
  psf_fwhm: 3.0
  psf_kernel_size: 25
  read_noise_sigma: 3.0
  poisson_noise: false
  seed: 18
  truth:
    flux: 100000.0
    re: 8.0
    n: 2.0
    q: 0.65
    theta_deg: 30.0
    x0: 50.0
    y0: 50.0

preparation:
  background:
    method: empirical
    box_size: 30
    filter_size: 3
  noise:
    method: empirical
  detection:
    n_sigma: 3.0
    n_levels: 32
    npixels: 5

masking:
  connected_source:
    enabled: false
  star_halo:
    enabled: false
  interactive_refinement:
    enabled: false

psf:
  type: gaussian
  gaussian:
    fwhm: 3.0

fit:
  models:
    - single_sersic
  sampler:
    name: dynesty
    nlive: 300
    sample: rwalk
    dlogz: 0.01
    seed: 53
    n_processes: 10
    queue_size: 10
  comparison:
    enabled: false
  priors:
    single_sersic:
      flux:
        min_factor: 0.5
        max_factor: 1.5
      re:
        min: 4.0
        max: 12.0
      n:
        min: 1.0
        max: 4.0
      q:
        min: 0.4
        max: 0.9
      theta:
        min: "-pi/2"
        max: "pi/2"
      x0:
        offset: 2.0
      y0:
        offset: 2.0
      sky:
        min: -20.0
        max: 20.0

diagnostics:
  format: png
  corner: true
  residual: true
  radial_profile: true
  posterior_profile_bands: false
