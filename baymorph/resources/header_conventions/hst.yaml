# Images of the Hubble Space Telescope calibrated by the STScI pipelines. The
# SCI extensions carry the inverse sensitivity PHOTFLAM and the pivot
# wavelength PHOTPLAM, and the primary header the file name, the telescope,
# the detector and the start and end of the observation.
name: hst
title: Hubble Space Telescope images
priority: 50
references:
  - "STScI, ACS zeropoints: https://www.stsci.edu/hst/instrumentation/acs/data-analysis/zeropoints"
  - "STScI, ACS Data Handbook, section 2.4, Headers and Keywords: FILTER1, 'Element selected from filter wheel 1', and FILTER2, 'Element selected from filter wheel 2'; DETECTOR, EXPSTART and EXPEND: https://hst-docs.stsci.edu/acsdhb/chapter-2-acs-data-structure/2-4-headers-and-keywords"
match:
  - keyword: TELESCOP
    equals: HST
quantities:
  detector:
    keywords: [DETECTOR]
    note: "DETECTOR names the detector in use; for ACS, WFC, HRC or SBC."
  observation_start:
    keywords: [EXPSTART]
    unit: MJD
    note: "EXPSTART is the start time of the exposure as a Modified Julian
      Date."
  observation_end:
    keywords: [EXPEND]
    unit: MJD
    note: "EXPEND is the end time of the exposure as a Modified Julian
      Date."
  filter:
    keywords: [FILTER, FILTER1, FILTER2]
    ignore_prefixes: [CLEAR]
    note: "ACS has two filter wheels, FILTER1 and FILTER2, and a wheel that
      holds a CLEAR element holds no filter; two filters in the beam
      disagree. Other headers name the filter in FILTER."
  zeropoint:
    formula: "-2.5 * log10(PHOTFLAM) - 5 * log10(PHOTPLAM) - 2.408"
    unit: mag
    requires:
      - quantity: image_unit
        equals: ELECTRONS/S
      - keyword: FILENAME
        contains: _dr
    note: "PHOTFLAM is the inverse sensitivity in erg cm-2 A-1 per electron
      and PHOTPLAM the pivot wavelength in A. The AB zeropoint applies to
      count rates in electrons per second of distortion-corrected products
      (drz, drc); flt and flc images need the pixel area map first."
  photometric_system:
    value: AB
    requires:
      - quantity: image_unit
        equals: ELECTRONS/S
      - keyword: FILENAME
        contains: _dr
    note: "The zeropoint derived from PHOTFLAM and PHOTPLAM is on the AB
      system."
