object:
  name: simulated_galaxy

data:
  image_path: runs/simulated_galaxy/input/simulated_galaxy.fits
  target_position:
    x: 60
    y: 60
  cutout:
    mode: fixed
    size: 121

outputs:
  root: runs
  overwrite: true

diagnostics:
  titles:
    single_sersic: "Simulated single-Sérsic observation"

simulation:
  # The field must contain the sky plateau plus the preparation sky margin.
  shape: [121, 121]
  seed: 42

  truth:
    flux: 20000.0
    re: 6.0
    n: 2.0
    q: 0.75
    theta_deg: 25.0
    x0: 60.0
    y0: 60.0

  psf:
    type: gaussian
    fwhm: 2.0

  noise:
    sky: 20.0
    poisson_noise: false
    read_noise: 2.0

psf:
  type: gaussian
  gaussian:
    fwhm: 2.0

fit:
  models:
    - single_sersic

  likelihood:
    type: gaussian
    include_normalization: true

  sampler:
    name: nautilus
    init:
      n_live: 100
      seed: 42
    run:
      n_eff: 200
      f_live: 0.05

  priors:
    single_sersic:
      flux:
        type: uniform
        lower: 5000.0
        upper: 50000.0
      re:
        type: uniform
        lower: 2.0
        upper: 12.0
      n:
        type: uniform
        lower: 0.8
        upper: 4.0
      q:
        type: uniform
        lower: 0.5
        upper: 1.0
      theta:
        type: uniform
        lower: -pi/2
        upper: pi/2
      x0:
        type: uniform
        lower: -3.0
        upper: 3.0
        relative_to: target_x
      y0:
        type: uniform
        lower: -3.0
        upper: 3.0
        relative_to: target_y
      sky:
        type: uniform
        lower: -10.0
        upper: 10.0
