object:
  name: simulated_galaxy

data:
  image_path: runs/simulated_galaxy/input/simulated_galaxy.fits
  target_position:
    x: 80
    y: 80
  cutout:
    mode: fixed
    size: 161

outputs:
  root: runs
  overwrite: true

simulation:
  shape: [161, 161]
  seed: 42

  truth:
    flux: 20000.0
    re: 8.0
    n: 2.5
    q: 0.72
    theta_deg: 30.0
    x0: 80.0
    y0: 80.0

  psf:
    type: gaussian
    fwhm: 2.5

  noise:
    sky: 25.0
    poisson_noise: false
    read_noise: 5.0

psf:
  type: gaussian
  gaussian:
    fwhm: 2.5

fit:
  models:
    - single_sersic

  sampler:
    name: dynesty
    nlive: 300
    dlogz: 0.1
    seed: 42
    sample: rslice
    n_processes: 10
    queue_size: null

  priors:
    single_sersic:
      flux:
        min_factor: 0.25
        max_factor: 2.0
      re:
        min: 3.0
        max: 16.0
      n:
        min: 0.8
        max: 5.0
      q:
        min: 0.4
        max: 1.0
      theta:
        min: -pi/2
        max: pi/2
      x0:
        offset: 3.0
      y0:
        offset: 3.0
      sky:
        min: -1.0
        max: 1.0
