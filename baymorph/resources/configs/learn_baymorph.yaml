# Official fast end-to-end tutorial configuration for BayMorph.

object:
  name: learn_baymorph

data:
  image_path: runs/learn_baymorph/input/learn_baymorph.fits
  mask_path: null
  noise_map_path: null
  psf_path: null
  pixel_scale: null
  target_position:
    x: 80
    y: 80
  cutout:
    mode: fixed
    size: 161

outputs:
  root: runs
  overwrite: true

simulation:
  shape: [161, 161]
  seed: 42
  truth:
    flux: 20000.0
    re: 8.0
    n: 2.5
    q: 0.72
    theta_deg: 30.0
    x0: 80.0
    y0: 80.0
  psf:
    type: gaussian
    fwhm: 2.5
  noise:
    sky: 25.0
    poisson_noise: false
    read_noise: 5.0

preparation:
  background:
    method: empirical
    box_size: 24
    filter_size: 3
  noise:
    method: empirical
  detection:
    n_sigma: 3.0
    n_levels: 32
    npixels: 10

masking:
  connected_source:
    enabled: true
  star_halo:
    enabled: false
  interactive_refinement:
    enabled: false

psf:
  type: gaussian
  gaussian:
    fwhm: 2.5

fit:
  models:
    - single_sersic
  likelihood:
    type: gaussian
    include_normalization: true
  sampler:
    name: dynesty
    nlive: 75
    sample: rwalk
    dlogz: 1.0
    seed: 42
    n_processes: 1
    queue_size: null
  comparison:
    enabled: false
    metric: bayes_factor
  priors:
    single_sersic:
      flux:
        min_factor: 0.25
        max_factor: 2.0
      re:
        min: 3.0
        max: 16.0
      n:
        min: 0.8
        max: 5.0
      q:
        min: 0.4
        max: 1.0
      theta:
        min: -pi/2
        max: pi/2
      x0:
        offset: 3.0
      y0:
        offset: 3.0
      sky:
        min: -1.0
        max: 1.0

diagnostics:
  format: pdf
  corner: true
  residual: true
  radial_profile:
    binning: fixed
    dr: 1.0
    min_pixels: 50
    log_n_bins: 40
  posterior_profile_bands: true