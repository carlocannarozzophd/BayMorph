# Minimal configuration for an observed galaxy.
# Omitted options are filled from BayMorph defaults.

object:
  name: observed_galaxy

data:
  image_path: data/observed_galaxy.fits
  target_position:
    x: 500
    y: 500
  cutout:
    mode: fixed
    size: 200

outputs:
  root: runs
  overwrite: true

# The target-specific preparation stage automatically estimates the target
# geometry, elliptical radial profile, outer plateau, sky region, background,
# and robust noise level. The mesh settings below are retained for the
# preliminary detection pass used by the current pipeline.
preparation:
  background:
    method: empirical
    box_size: 30
    filter_size: 3
  noise:
    method: empirical
  detection:
    n_sigma: 3.0
    n_pixels: 20
    n_levels: 32

psf:
  type: empirical

fit:
  models:
    - single_sersic
    - double_sersic

  priors:
    single_sersic:
      x0:
        offset: 20.0
      y0:
        offset: 20.0

    double_sersic:
      x0:
        offset: 20.0
      y0:
        offset: 20.0

diagnostics:
  radial_profile:
    binning: fixed
    dr: 1.0
