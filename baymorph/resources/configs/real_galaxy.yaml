# Minimal configuration for an observed galaxy.
# Omitted options are filled from BayMorph defaults.

object:
  name: observed_galaxy

data:
  image_path: data/observed_galaxy.fits
  mask_path: null
  noise_map_path: null
  pixel_scale: null
  target_position:
    x: 500
    y: 500
  cutout:
    mode: auto
    initial_factor: 4.0
    sky_margin: 20.0
    min_size: 100
    max_size: null

outputs:
  root: runs
  overwrite: true

# The target-specific preparation stage estimates the target geometry,
# elliptical radial profile, outer plateau, sky region, background, and noise.
preparation:
  background:
    method: empirical
    box_size: 30
    filter_size: 3
  noise:
    method: empirical
  detection:
    n_sigma: 3.0
    n_pixels: 20
    n_levels: 32

masking:
  connected_source:
    enabled: true
  star_halo:
    enabled: true
  interactive_refinement:
    enabled: true

psf:
  type: empirical

fit:
  models:
    - single_sersic
    - double_sersic

  sampler:
    name: dynesty
    nlive: 500
    sample: auto
    dlogz: 0.1
    seed: null
    n_processes: 1
    queue_size: null

  comparison:
    enabled: true
    metric: bayes_factor

  priors:
    single_sersic:
      x0:
        offset: 20.0
      y0:
        offset: 20.0

    double_sersic:
      x0:
        offset: 20.0
      y0:
        offset: 20.0

diagnostics:
  format: pdf
  corner: true
  residual: true
  posterior_profile_bands: true
  radial_profile:
    binning: fixed
    dr: 1.0
  titles:
    single_sersic: "Single Sérsic"
    double_sersic: "Double Sérsic"
