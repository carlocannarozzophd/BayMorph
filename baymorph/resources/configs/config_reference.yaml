# BayMorph full configuration reference.
# This file documents currently supported configurable fields.
# Remove sections that are not needed for a specific analysis.

object:
  name: example_galaxy

data:
  image_path: data/example_galaxy.fits
  mask_path: null
  noise_map_path: null
  psf_path: null
  pixel_scale: null
  target_position:
    x: 500
    y: 500
  cutout:
    mode: fixed                  # currently supported: fixed
    size: 200

outputs:
  root: runs
  overwrite: false

# Used only when generating a synthetic observation.
simulation:
  shape: [1000, 1000]
  seed: 42
  truth:
    flux: 100000.0
    re: 35.0
    n: 4.0
    q: 0.7
    theta_deg: 31.5
    x0: 500.0
    y0: 500.0
  psf:
    type: gaussian
    fwhm: 3.0
    size: 25
  noise:
    sky: 10.0
    poisson_noise: true
    read_noise: 2.0

# Image preparation first performs source detection. It then identifies the
# target, estimates its elliptical geometry and radial profile, detects the
# outer plateau, constructs a contaminant-clean sky region, and estimates a
# constant background and MAD-based noise level from that region. Plateau and
# sky-margin controls are currently internal defaults and are not yet exposed
# as YAML options.
preparation:
  background:
    method: empirical            # preliminary mesh estimate for detection
    box_size: 30
    filter_size: 3
  noise:
    method: empirical            # preliminary detection-stage noise estimate
  detection:
    n_sigma: 3.0
    n_pixels: 20
    n_levels: 32

masking:
  connected_source:
    enabled: true
  star_halo:
    enabled: true
  interactive_refinement:
    enabled: true

psf:
  type: empirical                # empirical or gaussian
  gaussian:
    fwhm: 3.0
  empirical:
    candidate_selection:
      auto: true
      target_n_candidates: 30
      min_area: 10
      max_area: 800
      min_peak: 20
      max_peak: 80000
      max_eccentricity: 0.8
      max_elongation: 2.5
      edge_margin: 30
      galaxy_exclusion_box: null
      sigma_factor: 4.0
      size_margin: 4
      min_half_size: 12
      max_half_size: 30
      isolation_margin: 2
    construction:
      auto_size: true
      normalize: true

fit:
  models:
    - single_sersic
    - double_sersic

  sampler:
    name: dynesty
    nlive: 500
    sample: auto
    dlogz: 0.1
    seed: null
    n_processes: 1
    queue_size: null

  comparison:
    enabled: true
    metric: bayes_factor

  priors:
    single_sersic:
      flux:
        min_factor: 0.0
        max_factor: 2.0
      re:
        min: 1.0
        max: 120.0
      n:
        min: 0.5
        max: 6.0
      q:
        min: 0.4
        max: 1.0
      theta:
        min: -pi/2
        max: pi/2
      x0:
        offset: 8.0
      y0:
        offset: 8.0
      sky:
        min: -50.0
        max: 50.0

    double_sersic:
      flux_bulge:
        min_factor: 0.0
        max_factor: 1.0
      re_bulge:
        min: 1.0
        max: 30.0
      n_bulge:
        min: 1.5
        max: 6.0
      q_bulge:
        min: 0.4
        max: 1.0
      theta_bulge:
        min: -pi/2
        max: pi/2
      flux_disk:
        min_factor: 0.0
        max_factor: 2.0
      re_disk:
        min: 10.0
        max: 120.0
      n_disk:
        min: 0.5
        max: 3.0
      q_disk:
        min: 0.4
        max: 1.0
      theta_disk:
        min: -pi/2
        max: pi/2
      x0:
        offset: 8.0
      y0:
        offset: 8.0
      sky:
        min: -50.0
        max: 50.0

diagnostics:
  format: pdf
  corner: true
  residual: true
  posterior_profile_bands: true
  radial_profile:
    binning: fixed               # fixed, adaptive, or logarithmic
    dr: 1.0
    min_pixels: 50
    log_n_bins: 40
  titles:
    single_sersic: "Single Sérsic"
    double_sersic: "Double Sérsic"
