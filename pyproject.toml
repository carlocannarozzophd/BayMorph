[build-system]
requires = [
    "setuptools>=77",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "baymorph"
version = "0.3.0"
description = "Bayesian morphological modelling of astronomical images."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Carlo Cannarozzo" },
]

keywords = [
    "astronomy",
    "bayesian inference",
    "galaxy morphology",
    "nested sampling",
    "sersic",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "photutils>=3.0",
    "matplotlib",
    "pyyaml",
    "dynesty>=3.0,<4",
    "h5py>=3,<4",
    "pocomc>=1.2.6,<2",
    "nautilus-sampler>=1.0.6,<2",
    "multiprocess>=0.70.18,<1",
    "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
interactive = [
    "anywidget",
    "ipython",
    "ipywidgets",
    "plotly",
]
dev = [
    "pytest",
    "jupyter",
    "ipykernel",
    "black",
    "ruff==0.15.16",
    "scikit-learn",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/carlocannarozzophd/BayMorph"
Repository = "https://github.com/carlocannarozzophd/BayMorph"
Documentation = "https://github.com/carlocannarozzophd/BayMorph/tree/main/docs"
Issues = "https://github.com/carlocannarozzophd/BayMorph/issues"
Changelog = "https://github.com/carlocannarozzophd/BayMorph/blob/main/CHANGELOG.md"

[project.scripts]
baymorph = "baymorph.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["baymorph*"]

[tool.setuptools.package-data]
"baymorph.resources" = [
    "configs/*.yaml",
    "notebooks/*.ipynb",
]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
