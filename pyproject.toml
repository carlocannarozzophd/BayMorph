[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baymorph"
version = "0.2.0"
description = "Bayesian morphological modelling of astronomical images."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Carlo Cannarozzo"}
]
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "photutils",
    "matplotlib",
    "pyyaml",
    "dynesty",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
keywords = [
    "astronomy",
    "galaxy morphology",
    "Bayesian inference",
    "nested sampling",
    "Sersic",
]

[project.urls]
Homepage = "https://github.com/carlocannarozzophd/BayMorph"
Repository = "https://github.com/carlocannarozzophd/BayMorph"
Documentation = "https://github.com/carlocannarozzophd/BayMorph/tree/main/docs"
Issues = "https://github.com/carlocannarozzophd/BayMorph/issues"
Changelog = "https://github.com/carlocannarozzophd/BayMorph/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
    "ipykernel",
    "black",
    "ruff",
    "build",
    "twine",
]

[project.scripts]
baymorph = "baymorph.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["baymorph*"]

[tool.setuptools.package-data]
"baymorph.resources" = [
    "configs/*.yaml",
    "notebooks/*.ipynb",
]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88